---
layout: default
---

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" type="text/javascript"></script>

<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">Posted on {{ page.date | date: "%B %-d, %Y" }} by {% if page.author %} {{ page.author }}{% endif %}
{% if page.categories %}
  in
  {% for cat in page.categories %}
  <a href="/categories/#{{ cat }}" title="{{ cat }}">{{ cat }}</a>&nbsp;
  {% endfor %}
{% endif %}
<!--{% if page.comments %} • <a href="http://moreisdifferent.com{{ page.url }}#disqus_thread">0 Comments</a>{% endif %}-->
</p>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

</div>

{% include disqus.html %}
