# Site settings
title: Dan Elton
email:
description: >-
  Blog of Dan Elton — scientist and builder working across biosecurity,
  AI safety, genetics, and human longevity.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://www.moreisdifferent.com" # the base hostname & protocol for your site
twitter_username: moreisdifferent
#github_username:  delton137

# Build settings
markdown: kramdown

# The production_url is only used when full-domain names are needed
# such as sitemap.txt
# Most places will/should use BASE_PATH to make the urls
#
# If you have set a CNAME (pages.github.com) set your custom domain here.
# Else if you are pushing to username.github.io, replace with your username.
# Finally if you are pushing to a GitHub project page, include the project name at the end.
#
production_url : https://www.moreisdifferent.com

# Other options
permalink: blog/:year/:month/:day/:title/
jobtitle: "Researcher"
excerpt_separator: "<!--more-->"

# SEO stuff (used by jekyll-seo-tag)
author:
  name: Dan Elton
  twitter: moreisdifferent
twitter:
  username: moreisdifferent
  card: summary
social:
  name: Dan Elton
  links:
    - https://twitter.com/moreisdifferent
    - https://github.com/delton137

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Default social share image for posts (og:image fallback; override per-post with image:)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      image: /assets/Dan_Elton_Star_Trek_Enterprise_cropped_650w.jpg

exclude:
  - build_bibliography.py
  - gemfile.bak
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
