<!-- Google Analytics 4. Replace G-XXXXXXXXXX with your real measurement ID
     (create a GA4 property at https://analytics.google.com). The snippet is
     disabled until the placeholder is replaced. -->
{% assign ga4_id = "G-XXXXXXXXXX" %}
{% unless ga4_id contains "XXXX" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga4_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ ga4_id }}');
</script>
{% endunless %}
